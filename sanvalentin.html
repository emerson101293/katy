<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de San Valentín</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffdde1;
            color: #333;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 50px;
        }
        .heart {
            color: red;
            font-size: 50px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>💖 ¡Feliz San Valentín, mi amor! 💖</h1>
        <p>Te invito a una cita especial el <strong>14 de febrero</strong>. 💕</p>
        <p>¿Aceptas? 😊</p>
        <button onclick="alert('¡Sabía que dirías que sí! 💕')">Sí, acepto</button>
    </div>
</body>
</html>
