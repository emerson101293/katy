<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de San Valentín 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #ffdde1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Fondo de Corazones Animados */
        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            color: red;
            font-size: 24px;
            opacity: 0.6;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Tarjeta de Invitación */
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
            z-index: 2;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Efecto de zoom en el título */
        h1 {
            font-size: 26px;
            color: #ff4d6d;
            animation: zoomIn 2s ease-in-out infinite alternate;
        }

        @keyframes zoomIn {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        p {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }

        /* Botón Interactivo */
        .btn {
            background-color: #ff4d6d;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #d43f5e;
            transform: scale(1.1);
        }

        /* Contenedor de la música */
        .audio-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
        }

    </style>
</head>
<body>

    <!-- Corazones Animados -->
    <div class="hearts"></div>

    <!-- Tarjeta de Invitación -->
    <div class="card">
        <h1>💖 ¡Feliz San Valentín, mi amor! 💖</h1>
        <p>Te invito a una cita especial el <strong>14 de febrero</strong>. 💕</p>
        <p>¿Aceptas? 😊</p>
        <button class="btn" onclick="mostrarMensaje()">Sí, acepto 💘</button>
    </div>

    <!-- Música de fondo -->
    <div class="audio-container">
        <audio id="bg-music" loop autoplay>
            <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        function mostrarMensaje() {
            alert('¡Sabía que dirías que sí! 💕 Te amo 😘');
        }

        function crearCorazones() {
            const heartsContainer = document.querySelector('.hearts');
            for (let i = 0; i < 15; i++) {
                let heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = `${Math.random() * 100}vw`;
                heart.style.animationDuration = `${4 + Math.random() * 3}s`;
                heartsContainer.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 7000);
            }
        }

        setInterval(crearCorazones, 800);
    </script>

</body>
</html>
