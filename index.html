<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de San Valentín 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #ffdde1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }

        .hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            color: red;
            font-size: 24px;
            opacity: 0.6;
            animation: float 4s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 24px;
            color: #ff4d6d;
        }

        p {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #d43f5e;
            transform: scale(1.1);
        }

        .hidden {
            display: none;
        }

    </style>
</head>
<body>
    <div class="hearts"></div>

    <div id="page1" class="card">
        <h1>💖 ¡Feliz San Valentín, mi amor! 💖</h1>
        <p>Te invito a una cita especial el <strong>14 de febrero</strong>. 💕</p>
        <p>¿Aceptas? 😊</p>
        <button class="btn" onclick="mostrarSegundaPagina()">Sí, acepto 💘</button>
    </div>

    <div id="page2" class="card hidden">
        <h1>¡Gracias por aceptar! 🌟</h1>
        <p>¡Eres el amor de mi vida! 💖</p>
        <img src="https://i.pinimg.com/originals/9b/dc/c6/9bdcc6206c1d36a37149d31108c6bb41.gif" alt="San Valentín" width="200px">
        <button class="btn" onclick="volverInicio()">Volver al inicio</button>
    </div>

    <script>
        function mostrarSegundaPagina() {
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }

        function volverInicio() {
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page1').classList.remove('hidden');
        }

        function crearCorazones() {
            const heartsContainer = document.querySelector('.hearts');
            for (let i = 0; i < 20; i++) {
                let heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                heart.style.left = `${Math.random() * 100}vw`;
                heart.style.animationDuration = `${2 + Math.random() * 3}s`;
                heartsContainer.appendChild(heart);
                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }
        }

        setInterval(crearCorazones, 500);
    </script>
</body>
</html>
