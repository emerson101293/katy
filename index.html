<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de San Valentín 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #ffdde1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
            z-index: 2;
            width: 300px;
            transition: opacity 1s, transform 1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 24px;
            color: #ff4d6d;
            animation: zoomIn 2s ease-in-out infinite alternate;
        }

        @keyframes zoomIn {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        p {
            font-size: 18px;
            color: #333;
            margin: 10px 0;
        }

        .btn {
            background-color: #ff4d6d;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #d43f5e;
            transform: scale(1.1);
        }

        /* Segunda tarjeta con GIF */
        .new-card {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
            z-index: 2;
            width: 300px;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 1s, transform 1s;
        }

        .new-card img {
            width: 100%;
            border-radius: 10px;
        }

        /* Explosión de emojis */
        .emoji-container {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .emoji {
            position: absolute;
            font-size: 30px;
            opacity: 0;
            animation: explode 1.5s forwards ease-out;
        }

        @keyframes explode {
            0% {
                opacity: 1;
                transform: scale(1) translateX(0);
            }
            50% {
                transform: scale(1.5);
            }
            100% {
                opacity: 0;
                transform: scale(2) translateX(0) translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Tarjeta de Invitación -->
    <div class="card" id="card">
        <h1>💖 ¡Feliz San Valentín, mi amor! 💖</h1>
        <p>Te invito a una cita especial el <strong>14 de febrero</strong>. 💕</p>
        <p>¿Aceptas? 😊</p>
        <button class="btn" onclick="cambiarTarjeta()">Sí, acepto 💘</button>
    </div>

    <!-- Nueva tarjeta con GIF -->
    <div class="new-card" id="newCard">
        <h1>💘 ¡Eres lo mejor de mi vida! 💘</h1>
        <img src="https://i.pinimg.com/originals/9b/dc/c6/9bdcc6206c1d36a37149d31108c6bb41.gif" alt="Romántico">
        <p>Gracias por aceptar, mi amor. ¡Nos vemos en nuestra cita! 😘💕</p>
    </div>

    <!-- Contenedor de emojis explosivos -->
    <div class="emoji-container" id="emojiContainer"></div>

    <script>
        function cambiarTarjeta() {
            let card = document.getElementById("card");
            let newCard = document.getElementById("newCard");
            let emojiContainer = document.getElementById("emojiContainer");

            // Ocultar la tarjeta original
            card.style.opacity = "0";
            card.style.transform = "scale(0.8)";

            setTimeout(() => {
                card.style.display = "none";
                newCard.style.display = "block";

                // Mostrar la nueva tarjeta con animación
                setTimeout(() => {
                    newCard.style.opacity = "1";
                    newCard.style.transform = "scale(1)";
                    explosionEmojis();
                }, 100);
            }, 1000);
        }

        function explosionEmojis() {
            let emojiContainer = document.getElementById("emojiContainer");
            let emojis = ["😍", "💋", "💖", "🥰", "😘", "❤️"];

            for (let i = 0; i < 15; i++) {
                let emoji = document.createElement("div");
                emoji.classList.add("emoji");
                emoji.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Posición en los lados (izquierda o derecha)
                let side = Math.random() < 0.5 ? "left" : "right";
                emoji.style[side] = "-50px"; // Fuera de pantalla al inicio
                emoji.style.top = `${Math.random() * 100}vh`; // Posición aleatoria en altura
                
                // Animación de movimiento al centro
                emoji.style.animation = `explode 1.5s ${Math.random() * 0.5}s forwards`;

                emojiContainer.appendChild(emoji);

                // Eliminar después de la animación
                setTimeout(() => emoji.remove(), 2000);
            }
        }
    </script>

</body>
</html>
